name: Reference documentation archive

# Attaches the generated pdoc of a release to that release, as a tar.gz with its checksum, so the
# QTSurfer website can publish it. It runs after every release (see publish.yml) and by hand to build
# the archive of a release that already exists.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to document
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to document
        required: true
        type: string

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check that the release exists
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Generate docs
        run: ./scripts/docs.sh
      - name: Package the documentation
        run: |
          name="api-client-python-docs-${TAG}"
          tar -czf "${name}.tar.gz" -C docs .
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Attach it to the release
        run: |
          name="api-client-python-docs-${TAG}"
          gh release upload "$TAG" "${name}.tar.gz" "${name}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
